name: OmniWM CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check against its base branch (optional)
        required: false
        type: string

permissions:
  contents: read

cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  cache-dependencies:
    name: Cache dependencies
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    cache-mode: write
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/dev-tools/bin
            .cache/dev-tools/downloads
            Frameworks/GhosttyKit.xcframework
          key: dev-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/dev-tools.env', 'Scripts/build-metadata.env') }}
      - name: Set up dependencies
        run: ./Scripts/dev-tools.sh setup
  verify:
    name: Verify
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/dev-tools/bin
            .cache/dev-tools/downloads
            Frameworks/GhosttyKit.xcframework
          key: dev-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/dev-tools.env', 'Scripts/build-metadata.env') }}
      - name: Set up dependencies
        run: ./Scripts/dev-tools.sh setup
      - name: Test development tooling
        run: make test-dev-tools
      - name: Verify package toolchain
        run: swift package dump-package > /dev/null
      - name: Verify formatting, lint and build
        run: make verify
  tests:
    name: Tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/dev-tools/bin
            .cache/dev-tools/downloads
            Frameworks/GhosttyKit.xcframework
          key: dev-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/dev-tools.env', 'Scripts/build-metadata.env') }}
      - name: Set up dependencies
        run: ./Scripts/dev-tools.sh setup
      - name: Verify package toolchain
        run: swift package dump-package > /dev/null
      - name: Run the serial test suite
        run: LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)${LIBRARY_PATH:+:$LIBRARY_PATH}" swift test
