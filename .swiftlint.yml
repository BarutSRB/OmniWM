# SwiftLint configuration for OmniWM
# Swift 6.4 with strict concurrency

included:
  - Sources

excluded:
  - .build
  - Package.swift

# Disable rules that conflict with SwiftFormat
disabled_rules:
  - closure_parameter_position
  - colon
  - comma
  - leading_whitespace
  - line_length
  - opening_brace
  - operator_usage_whitespace
  - return_arrow_whitespace
  - sorted_imports
  - statement_position
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - vertical_whitespace
  # Preserve explicit replacement decoding and guaranteed UTF-8 encoder output.
  - optional_data_string_conversion

# Swift 6 does not need Swift 5 compatibility annotations. Unowned captures are
# reviewed against their actual lifetime contracts rather than prohibited.
opt_in_rules:
  - async_without_await
  - no_extension_access_modifier
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - last_where
  - overridden_super_call
  - sorted_first_last
  - unavailable_function

cyclomatic_complexity:
  warning: 10
  ignores_case_statements: true

nesting:
  ignore_typealiases_and_associatedtypes: true

type_name:
  excluded:
    - ID

function_parameter_count:
  warning: 5
  ignores_default_parameters: true

force_cast:
  severity: warning

force_try:
  severity: warning

empty_count:
  severity: warning

large_tuple:
  warning: 2

no_extension_access_modifier:
  severity: warning

type_body_length:
  warning: 300
  error: 3500

file_length:
  warning: 500
  error: 4000

function_body_length:
  warning: 50

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 60
  allowed_symbols:
    - _
  unallowed_symbols_severity: warning
  validates_start_with_lowercase: warning
  excluded:
    - id
    - x
    - y
    - i
    - j
